# Citation registry. Facts reference these by key; the build fails on an unknown key, and
# SOURCES.md is generated from this file.
#
# `method` is how the claim was actually checked and is displayed to the user:
#   fetched      - the page was retrieved and read in full
#   search_index - confirmed through a web search index, but the page itself could not be
#                  retrieved (this environment's egress policy blocks fema.gov, weather.gov,
#                  epa.gov and iii.org). Weaker. Re-verify by opening the URL.
#   phone        - a person called and was told this
#
# All sources below are currently search_index. Re-fetching them is item 1.1 of VERIFY.md.

