- slug: propane-grill-vs-camping
  category: hazardous
  names:
    en: [gas canister, fuel canister, camp fuel, white gas, kerosene, gasoline, old gas, lighter
      fluid, charcoal lighter]
    es: [gasolina, combustible, queroseno, gasolina vieja, liquido para encender]
  universal:
    hazard: hazardous
    neverCurbside: true
    why:
      en: Fuels are flammable and old gasoline is still flammable. None of this goes in a bin, and
        none of it goes down a drain or onto the ground.
    prep:
      - en: Keep fuel in an approved fuel container, sealed, away from heat.
      - en: Do not mix fuels together, and do not mix fuel with used motor oil.
    sourceRefs: [epa-hhw]
