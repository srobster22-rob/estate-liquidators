<title>Provenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,600;1,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#EDEEE8; --surface:#F6F7F2; --sunk:#E3E5DC;
  --ink:#161C22; --muted:#5B6570; --faint:#8A929B;
  --rule:#C7CBC1; --rule-soft:#DCDFD6;
  --accent:#2E6F63; --accent-soft:#DCE8E3;
  --ok:#2F6B4F; --ok-soft:#DDE9E0;
  --bad:#A0392B; --bad-soft:#F0DEDA;
  --warn:#8A6B2F;
  --shadow:0 1px 2px rgba(22,28,34,.06),0 8px 24px rgba(22,28,34,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#12161A; --surface:#1A1F25; --sunk:#0D1114;
    --ink:#E6E8E1; --muted:#9AA3AC; --faint:#6E7780;
    --rule:#2C333A; --rule-soft:#232930;
    --accent:#5FAE9B; --accent-soft:#1B2E2A;
    --ok:#6BB089; --ok-soft:#18271E;
    --bad:#D2705F; --bad-soft:#2C1917;
    --warn:#C0A063;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#12161A; --surface:#1A1F25; --sunk:#0D1114;
  --ink:#E6E8E1; --muted:#9AA3AC; --faint:#6E7780;
  --rule:#2C333A; --rule-soft:#232930;
  --accent:#5FAE9B; --accent-soft:#1B2E2A;
  --ok:#6BB089; --ok-soft:#18271E;
  --bad:#D2705F; --bad-soft:#2C1917;
  --warn:#C0A063;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,system-ui,sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 72px}

/* ---- masthead ---- */
header.mast{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:6px;
}
.mast h1{
  font-family:Petrona,Georgia,serif;font-weight:600;font-size:30px;letter-spacing:-.015em;
  margin:0;text-wrap:balance;
}
.mast .sub{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.rail{display:flex;gap:3px;margin:14px 0 22px;flex-wrap:wrap}
.rail i{
  width:13px;height:5px;background:var(--rule);border-radius:1px;display:block;
  transition:background .2s;
}
.rail i.ok{background:var(--ok)} .rail i.bad{background:var(--bad)}
.rail i.now{background:var(--accent);height:9px;margin-top:-2px}

/* ---- layout ---- */
.board{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:800px){.board{grid-template-columns:1fr}}

.card{
  background:var(--surface);border:1px solid var(--rule-soft);border-radius:3px;
  box-shadow:var(--shadow);
}
.card.lot{padding:0;overflow:hidden}
.lot-head{
  padding:18px 22px 14px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;
}
.lotno{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);font-weight:500;
}
.lot-head h2{
  font-family:Petrona,Georgia,serif;font-weight:600;font-size:23px;margin:4px 0 0;
  line-height:1.2;text-wrap:balance;
}
.attrib{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  text-align:right;line-height:1.7;white-space:nowrap;
}
.attrib b{display:block;color:var(--ink);font-weight:500;font-size:12.5px}

/* ---- dossier table ---- */
table.dossier{width:100%;border-collapse:collapse;font-size:13.5px}
table.dossier td{padding:9px 22px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table.dossier tr:last-child td{border-bottom:0}
td.k{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);width:40%;padding-top:11px;
}
td.v{font-weight:500}
tr.flag td{background:var(--bad-soft)}
tr.flag td.v::after{
  content:attr(data-note);display:block;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.04em;color:var(--bad);font-weight:400;margin-top:2px;
}
tr.late td{background:var(--accent-soft)}
tr.late td.v::after{
  content:attr(data-note);display:block;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.04em;color:var(--warn);font-weight:400;margin-top:2px;
}

/* ---- call panel ---- */
.panel{padding:18px 20px}
.panel h3{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 12px;font-weight:500;
}
.calls{display:grid;gap:9px}
button.call{
  font-family:Archivo,sans-serif;font-size:15px;font-weight:600;color:var(--ink);
  background:var(--ground);border:1.5px solid var(--rule);border-radius:2px;
  padding:14px 16px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;
}
button.call:hover{border-color:var(--accent);background:var(--surface)}
button.call:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.call span{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.08em;color:var(--muted);font-weight:400;margin-top:3px;text-transform:uppercase;
}

.verdict{border-radius:2px;padding:14px 16px;border:1.5px solid}
.verdict.right{background:var(--ok-soft);border-color:var(--ok)}
.verdict.wrong{background:var(--bad-soft);border-color:var(--bad)}
.verdict .head{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:500;
}
.verdict.right .head{color:var(--ok)} .verdict.wrong .head{color:var(--bad)}
.verdict p{margin:6px 0 0;font-size:13.5px;line-height:1.5}
button.next{
  width:100%;margin-top:12px;font-family:Archivo,sans-serif;font-weight:600;font-size:14px;
  background:var(--ink);color:var(--ground);border:0;border-radius:2px;padding:12px;cursor:pointer;
}
button.next:hover{background:var(--accent)}
button.next:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- tally ---- */
.tally{display:flex;gap:0;border-top:1px solid var(--rule);margin-top:16px}
.tally div{flex:1;padding:11px 0 2px;border-right:1px solid var(--rule-soft)}
.tally div:last-child{border-right:0}
.tally b{
  display:block;font-family:Petrona,Georgia,serif;font-size:23px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.tally span{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);
}

/* ---- field notes ---- */
.notes{margin-top:22px}
.notes .grp{border-top:1px solid var(--rule-soft);padding:9px 0}
.notes .grp:first-of-type{border-top:0}
.notes .pname{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);font-weight:500;
}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 6px;border-radius:2px;
  background:var(--sunk);color:var(--muted);border:1px solid var(--rule-soft);
}
.chip.no{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.empty{color:var(--faint);font-size:12.5px;font-style:italic}

/* ---- report ---- */
.report{max-width:660px;margin:0 auto}
.report h2{font-family:Petrona,Georgia,serif;font-size:27px;font-weight:600;margin:0 0 4px}
.curve{display:flex;align-items:flex-end;gap:8px;height:130px;margin:22px 0 8px}
.curve .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.curve .fill{background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.curve .lb{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
  color:var(--faint);text-align:center;margin-top:6px;text-transform:uppercase;
}
.curve .pc{
  font-family:Petrona,serif;font-size:15px;font-weight:600;text-align:center;
  font-variant-numeric:tabular-nums;margin-bottom:4px;
}
.finding{
  border-left:2.5px solid var(--accent);padding:2px 0 2px 14px;margin:20px 0;
  font-size:14px;line-height:1.6;
}
.foot{
  margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--muted);line-height:1.6;
}
.foot code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
/* ---- examination bench ---- */
.exam{display:grid;gap:6px}
button.ex{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-family:Archivo,sans-serif;font-size:13.5px;font-weight:500;color:var(--ink);
  background:var(--ground);border:1px solid var(--rule);border-radius:2px;
  padding:9px 11px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;
}
button.ex:hover:not(:disabled){border-color:var(--accent);background:var(--surface)}
button.ex:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.ex:disabled{opacity:.35;cursor:default}
button.ex em{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-style:normal;
  color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
}
button.ex.done{background:var(--sunk);border-style:dashed;color:var(--faint)}
td.locked{color:var(--faint);font-style:italic}
.free{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);
}
.money{display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.money:last-child{border-bottom:0}
.money span{font-size:13px;color:var(--muted)}
.money b{font-family:"IBM Plex Mono",monospace;font-size:14px;font-variant-numeric:tabular-nums}
.money b.pos{color:var(--ok)} .money b.neg{color:var(--bad)}
.valuebar{display:flex;align-items:baseline;gap:9px;margin-top:3px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.valuebar b{font-family:Petrona,serif;font-size:21px;font-weight:600;color:var(--ink)}
.tier{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;padding:2px 6px;border-radius:2px;
  background:var(--accent-soft);color:var(--accent)}
.stakes{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  line-height:1.75;margin-top:11px;padding-top:10px;border-top:1px solid var(--rule-soft)}
.stakes s{display:block;text-decoration:none}
.bust{border-color:var(--bad)!important;background:var(--bad-soft)!important}
</style>
<div class="wrap" id="app"></div>
<script>
const PERIODS=["Queen Anne","Georgian","Regency","Victorian","Edwardian"];
const YEARS={"Queen Anne":"c. 1702–1730","Georgian":"c. 1714–1800","Regency":"c. 1800–1830",
             "Victorian":"c. 1837–1901","Edwardian":"c. 1901–1910"};
const RULES={
 primary_wood:{"Queen Anne":["walnut","maple"],"Georgian":["mahogany","walnut"],"Regency":["mahogany","rosewood"],"Victorian":["mahogany","oak","rosewood"],"Edwardian":["oak","satinwood","mahogany"]},
 secondary_wood:{"Queen Anne":["pine","oak"],"Georgian":["pine","oak"],"Regency":["pine","deal"],"Victorian":["deal","pine"],"Edwardian":["deal","plywood"]},
 joinery:{"Queen Anne":["hand_dovetail_coarse"],"Georgian":["hand_dovetail_coarse","hand_dovetail_fine"],"Regency":["hand_dovetail_fine"],"Victorian":["hand_dovetail_fine","machine_dovetail"],"Edwardian":["machine_dovetail"]},
 finish:{"Queen Anne":["oil_wax"],"Georgian":["oil_wax","shellac"],"Regency":["shellac","french_polish"],"Victorian":["french_polish","varnish"],"Edwardian":["varnish","spirit_lacquer"]},
 hardware:{"Queen Anne":["handmade_brass","iron_pin"],"Georgian":["handmade_brass","cast_brass"],"Regency":["cast_brass"],"Victorian":["cast_brass","machine_screw"],"Edwardian":["machine_screw","pressed_steel"]},
 saw_marks:{"Queen Anne":["pit_saw"],"Georgian":["pit_saw","frame_saw"],"Regency":["frame_saw"],"Victorian":["circular_saw","frame_saw"],"Edwardian":["circular_saw","band_saw"]},
 wear_pattern:{"Queen Anne":["deep_uneven"],"Georgian":["deep_uneven","moderate"],"Regency":["moderate"],"Victorian":["moderate","light"],"Edwardian":["light","minimal"]}
};
const ATTRS=Object.keys(RULES);
const LABEL={primary_wood:"Primary timber",secondary_wood:"Secondary timber",joinery:"Drawer joinery",
             finish:"Surface finish",hardware:"Hardware",saw_marks:"Saw marks",wear_pattern:"Wear"};
const NAME={walnut:"Walnut",maple:"Maple",mahogany:"Mahogany",rosewood:"Rosewood",oak:"Oak",
  satinwood:"Satinwood",pine:"Pine",deal:"Deal",plywood:"Plywood",
  hand_dovetail_coarse:"Hand-cut dovetails, coarse",hand_dovetail_fine:"Hand-cut dovetails, fine",
  machine_dovetail:"Machine-cut dovetails",oil_wax:"Oil and wax",shellac:"Shellac",
  french_polish:"French polish",varnish:"Varnish",spirit_lacquer:"Spirit lacquer",
  handmade_brass:"Hand-made brass",iron_pin:"Iron pins",cast_brass:"Cast brass",
  machine_screw:"Machine-threaded screws",pressed_steel:"Pressed steel",
  pit_saw:"Pit-saw marks",frame_saw:"Frame-saw marks",circular_saw:"Circular-saw marks",
  band_saw:"Band-saw marks",deep_uneven:"Deep and uneven",moderate:"Moderate",
  light:"Light",minimal:"Minimal"};
const FORMS=["bureau","chest of drawers","side table","bookcase","writing desk","linen press",
  "card table","washstand","davenport","corner cupboard","tea table","chest-on-stand"];

const R=(s=>()=>((s=s*1103515245+12345&0x7fffffff)/0x7fffffff))(Date.now()%100000+7);
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function genuine(p,anomalies=true){
  const o={}; ATTRS.forEach(a=>o[a]=pick(RULES[a][p]));
  if(!anomalies) return {obj:o,repairs:[]};
  const r=R(); if(r<0.55) return {obj:o,repairs:[]};
  const n=r<0.88?1:2, idx=PERIODS.indexOf(p), reps=[];
  shuffle(ATTRS.slice()).slice(0,n).forEach(a=>{
    const later=PERIODS.slice(idx+1).flatMap(q=>RULES[a][q]).filter(v=>!RULES[a][p].includes(v));
    if(later.length){o[a]=pick(later); reps.push(a)}
  });
  return {obj:o,repairs:reps};
}
function skill(){const r=R(); return r<0.08?0:r<0.20?1:r<0.82?2+Math.floor(R()*2):4+Math.floor(R()*3)}
function forgery(p,kIn){
  // Clean base, exactly as make_forgery() does in provenance.py. Building on a
  // repaired piece would hand the forger extra off-period features for free and
  // push cue counts out of the learnable band — an 8-point drift when first ported.
  const {obj:o}=genuine(p,false), k=(kIn===undefined?skill():kIn); if(k<=0) return {obj:o,errors:[]};
  const idx=PERIODS.indexOf(p), errs=[];
  shuffle(ATTRS.slice()).slice(0,Math.min(k,ATTRS.length)).forEach(a=>{
    const nb=[idx-1,idx+1].filter(i=>i>=0&&i<PERIODS.length).map(i=>PERIODS[i]);
    let c=[...new Set(nb.flatMap(q=>RULES[a][q]))].filter(v=>!RULES[a][p].includes(v));
    if(!c.length) c=[...new Set(PERIODS.flatMap(q=>RULES[a][q]))].filter(v=>!RULES[a][p].includes(v));
    if(c.length){o[a]=pick(c); errs.push(a)}
  });
  return {obj:o,errors:errs};
}
function earliestPeriodFor(attr,val){
  for(let i=0;i<PERIODS.length;i++) if(RULES[attr][PERIODS[i]].includes(val)) return i;
  return 99;
}

/* ============================================================================
   THE GAME LAYER.
   v1 of this prototype showed all seven attributes for free and asked one
   question — which is a quiz, not a game. There was no decision in it.
   The missing verb came from another card in the same portfolio: #17
   Differential, whose bet is "the cost of a test is the game."
   So: information costs money, the lot's value decides whether knowing is
   worth buying, and a master forger only bothers with valuable pieces.
   ========================================================================== */

const EXAMS = [
  {a:"primary_wood",   cost:30,  label:"Look it over",            note:"Timber, by eye"},
  {a:"wear_pattern",   cost:40,  label:"Handle it",               note:"Wear at the edges"},
  {a:"finish",         cost:60,  label:"Solvent test",            note:"Finish, on a hidden spot"},
  {a:"hardware",       cost:70,  label:"Draw a handle",           note:"Hardware and its seating"},
  {a:"secondary_wood", cost:90,  label:"Pull the drawers",        note:"Secondary timber"},
  {a:"joinery",        cost:110, label:"Dismantle a drawer",      note:"How the corners are cut"},
  {a:"saw_marks",      cost:140, label:"Open the carcase",        note:"Saw marks inside"},
];
const FULL = EXAMS.reduce((s,e)=>s+e.cost,0);   // £540

const TIERS = [
  {name:"modest",   lo:400,  hi:900,  skill:()=>3+Math.floor(R()*4)},   // crude fakes
  {name:"middling", lo:900,  hi:2500, skill:()=>2+Math.floor(R()*3)},
  {name:"fine",     lo:2500, hi:6000, skill:()=>Math.floor(R()*3)},     // master forgers
];

const RUN = 20;
const START = 1500;

function makeLot(){
  const t = TIERS[Math.floor(R()*TIERS.length)];
  const value = Math.round((t.lo + R()*(t.hi-t.lo))/50)*50;
  const period = pick(PERIODS);
  const fake = R() < 0.5;
  const built = fake ? forgery(period, t.skill()) : genuine(period);
  return {period, fake, value, tier:t.name, obj:built.obj,
          form:pick(FORMS), lot:100+Math.floor(R()*800),
          seen:new Set([pick(ATTRS)]), spent:0};
}

let cash = START, n = 0, lot = makeLot(), decided = null, history = [];
const notes = {};
PERIODS.forEach(p=>{notes[p]={}; ATTRS.forEach(a=>notes[p][a]={ok:new Set(),no:new Set()})});

const gbp = v => (v<0?"−£":"£") + Math.abs(Math.round(v)).toLocaleString();
const pctOf = (n,d) => d ? Math.round(100*n/d) : 0;

function payoff(lot, authenticate){
  if(authenticate) return lot.fake ? -0.35*lot.value : 0.10*lot.value;
  return lot.fake ? 60 : -0.04*lot.value;
}

function examine(idx){
  const e = EXAMS[idx];
  if(lot.seen.has(e.a) || decided) return;
  if(cash < e.cost) return;
  cash -= e.cost; lot.spent += e.cost; lot.seen.add(e.a); render();
}

function decide(authenticate){
  if(decided) return;
  const p = payoff(lot, authenticate);
  cash += p;
  decided = {authenticate, payoff:p, correct: authenticate !== lot.fake};
  ATTRS.forEach(a=>{
    const v = lot.obj[a];
    if(RULES[a][lot.period].includes(v)) notes[lot.period][a].ok.add(v);
    else if(earliestPeriodFor(a,v) < PERIODS.indexOf(lot.period)) notes[lot.period][a].no.add(v);
  });
  history.push({correct:decided.correct, payoff:p, spent:lot.spent,
                value:lot.value, fake:lot.fake, authenticate});
  render();
}

function nextLot(){
  n++;
  if(n>=RUN || cash<=0) return report();
  lot = makeLot(); decided = null; render();
}
const el = document.getElementById("app");

function render(){
  const idx = PERIODS.indexOf(lot.period);
  const rows = ATTRS.map(a=>{
    const known = lot.seen.has(a) || decided;
    const v = lot.obj[a];
    const isFree = lot.seen.has(a) && !decided;
    if(!known) return `<tr><td class="k">${LABEL[a]}</td><td class="v locked">not examined</td></tr>`;
    let cls="", note="";
    if(decided && !RULES[a][lot.period].includes(v)){
      const e = earliestPeriodFor(a,v);
      if(e < idx){ cls="flag"; note="Impossible — predates the piece"; }
      else { cls="late"; note="Later than the piece — a repair, or a slip"; }
    }
    return `<tr class="${cls}"><td class="k">${LABEL[a]}</td>
      <td class="v" data-note="${note}">${NAME[v]}</td></tr>`;
  }).join("");

  const bench = decided ? "" : `
    <h3>Examination — each costs</h3>
    <div class="exam">${EXAMS.map((e,i)=>{
      const done = lot.seen.has(e.a), broke = cash < e.cost;
      return `<button class="ex ${done?'done':''}" ${done||broke?'disabled':''}
        onclick="examine(${i})">
        <span>${done?'✓ ':''}${e.label}<br><em style="font-size:10.5px">${e.note}</em></span>
        <em>${done?'paid':gbp(e.cost)}</em></button>`;
    }).join("")}</div>
    <div class="stakes">
      <s>Authenticate, and it's genuine &nbsp;→&nbsp; <b style="color:var(--ok)">${gbp(0.10*lot.value)}</b></s>
      <s>Authenticate a forgery &nbsp;→&nbsp; <b style="color:var(--bad)">${gbp(-0.35*lot.value)}</b></s>
      <s>Reject a forgery &nbsp;→&nbsp; ${gbp(60)} finder's fee</s>
      <s>Reject a genuine piece &nbsp;→&nbsp; ${gbp(-0.04*lot.value)} in lost goodwill</s>
      <s style="margin-top:6px;color:var(--faint)">Examining everything costs ${gbp(FULL)}.</s>
    </div>`;

  const call = decided ? (()=>{
    const d = decided;
    return `<div class="verdict ${d.correct?'right':'wrong'}">
        <div class="head">${d.correct?"Correct":"Wrong"} · ${d.payoff>=0?'+':''}${gbp(d.payoff)}</div>
        <p><strong>${lot.fake?"A forgery.":"Genuine."}</strong>
        ${d.correct
          ? (lot.fake ? "Rejected. The fee is small but the disaster was smaller."
                      : "Authenticated, and the commission is yours.")
          : (lot.fake ? "You put your name to a fake. That is the expensive mistake."
                      : "You turned down an honest piece. Everything odd about it was age.")}
        </p></div>
      <div class="stakes"><s>Examinations this lot: ${gbp(lot.spent)}
        &nbsp;·&nbsp; Net on the lot: <b style="color:var(--${d.payoff-lot.spent>=0?'ok':'bad'})">
        ${gbp(d.payoff - lot.spent)}</b></s></div>
      <button class="next" onclick="nextLot()">
        ${n===RUN-1||cash<=0?"Close the books":"Next lot"}</button>`;
  })() : `
    <div class="calls" style="margin-top:14px">
      <button class="call" onclick="decide(true)">Authenticate
        <span>Put your name to it</span></button>
      <button class="call" onclick="decide(false)">Reject
        <span>Advise against — walk away</span></button>
    </div>`;

  const correct = history.filter(h=>h.correct).length;
  el.innerHTML = `
  <header class="mast">
    <div><h1>Provenance</h1></div>
    <div class="sub">Lot ${n+1} of ${RUN} · ${gbp(cash)} in hand</div>
  </header>
  <div class="rail">${Array.from({length:RUN},(_,k)=>{
    const c = k<history.length ? (history[k].correct?"ok":"bad") : (k===n?"now":"");
    return `<i class="${c}"></i>`}).join("")}</div>

  <div class="board">
    <div class="card lot ${cash<=0?'bust':''}">
      <div class="lot-head">
        <div>
          <div class="lotno">Lot ${lot.lot}</div>
          <h2>${lot.seen.has("primary_wood")||decided?NAME[lot.obj.primary_wood]+" ":""}${lot.form}</h2>
          <div class="valuebar"><b>${gbp(lot.value)}</b>
            <span class="tier">${lot.tier}</span> reserve</div>
        </div>
        <div class="attrib">Attributed<b>${lot.period}</b>${YEARS[lot.period]}</div>
      </div>
      <table class="dossier">${rows}</table>
    </div>

    <div>
      <div class="card panel">${bench}${call}</div>
      <div class="card panel" style="margin-top:14px">
        <h3>Ledger</h3>
        <div class="money"><span>In hand</span>
          <b class="${cash>=START?'pos':'neg'}">${gbp(cash)}</b></div>
        <div class="money"><span>Calls right</span>
          <b>${correct}/${history.length}${history.length?` · ${pctOf(correct,history.length)}%`:''}</b></div>
        <div class="money"><span>Spent examining</span>
          <b>${gbp(history.reduce((s,h)=>s+h.spent,0)+(decided?0:lot.spent))}</b></div>
      </div>
      <div class="card panel notes">
        <h3>Field notes — what you've seen</h3>${notesHTML()}
      </div>
    </div>
  </div>`;
}

function notesHTML(){
  const out = PERIODS.filter(p=>ATTRS.some(a=>notes[p][a].ok.size||notes[p][a].no.size))
    .map(p=>{
      const chips = ATTRS.flatMap(a=>[
        ...[...notes[p][a].ok].map(v=>`<span class="chip">${NAME[v]}</span>`),
        ...[...notes[p][a].no].map(v=>`<span class="chip no">${NAME[v]}</span>`)
      ]).join("");
      return `<div class="grp"><div class="pname">${p}</div><div class="chips">${chips}</div></div>`;
    }).join("");
  return out || `<p class="empty">Fills in as you work. Plain chips are features you've
    confirmed on a genuine piece; red ones cannot belong to that period at all.</p>`;
}
function report(){
  const done = history.length;
  const correct = history.filter(h=>h.correct).length;
  const spent = history.reduce((s,h)=>s+h.spent,0);
  const gross = history.reduce((s,h)=>s+h.payoff,0);
  const bust = cash<=0;

  // The economic finding: did examination spend track lot value?
  const byTier = {};
  history.forEach((h,k)=>{
    const t = h.value<900?"modest":h.value<2500?"middling":"fine";
    (byTier[t] ||= {n:0,spent:0,right:0}); byTier[t].n++;
    byTier[t].spent += h.spent; byTier[t].right += h.correct?1:0;
  });
  const order = ["modest","middling","fine"].filter(t=>byTier[t]);
  const disc = order.length>1
    ? Math.round(byTier[order[order.length-1]].spent/byTier[order[order.length-1]].n)
      - Math.round(byTier[order[0]].spent/byTier[order[0]].n)
    : 0;

  const first = history.slice(0,7), last = history.slice(-7);
  const f = pctOf(first.filter(h=>h.correct).length, first.length);
  const l = pctOf(last.filter(h=>h.correct).length, last.length);

  el.innerHTML = `
  <header class="mast"><div><h1>Provenance</h1></div>
    <div class="sub">${bust?"Ruined":"Books closed"} · ${done} lots</div></header>
  <div class="report">
    <div class="card panel ${bust?'bust':''}" style="padding:26px 24px">
      <h2>${bust?"You ran out of money.":gbp(cash)+" in hand"}</h2>
      <p style="color:var(--muted);margin:0 0 18px">
        Started with ${gbp(START)}. Earned ${gbp(gross)} on calls, spent ${gbp(spent)}
        examining. ${correct} of ${done} calls right.</p>

      <table class="dossier" style="border-top:1px solid var(--rule)">
        <tr><td class="k">Tier</td><td class="k">Avg. examined</td><td class="k">Calls right</td></tr>
        ${order.map(t=>`<tr><td class="v">${t}</td>
          <td class="v">${gbp(byTier[t].spent/byTier[t].n)}</td>
          <td class="v">${pctOf(byTier[t].right,byTier[t].n)}%</td></tr>`).join("")}
      </table>

      <div class="finding">
        ${disc>80
          ? `You spent <strong>${gbp(disc)} more</strong> examining a fine lot than a modest one.
             That is the whole game working: on a ${gbp(600)} piece the full bench costs almost
             as much as the commission, so you have to commit on thin evidence. On a ${gbp(5000)}
             piece it is cheap insurance.`
          : disc<-40
          ? `You spent <em>more</em> on cheap lots than dear ones — worth a look. The commission
             on a modest piece rarely covers a full examination.`
          : `You examined every tier about equally. The economy says you shouldn't: a full bench
             costs ${gbp(FULL)}, which is most of the commission on a modest lot and a rounding
             error on a fine one.`}
      </div>

      <p style="font-size:13.5px;color:var(--muted);line-height:1.65">
        <strong>The rule underneath.</strong> A repair always uses a part from <em>after</em>
        the piece was made, so a later feature is ambiguous and an earlier one is impossible.
        And forgers work where the money is: modest lots carry crude fakes you can catch on one
        look, fine lots carry the ones worth ${gbp(FULL)} to be sure about.
        ${l>f?`Your accuracy went ${f}% → ${l}% across the sale.`:
          l<f?`Your accuracy went ${f}% → ${l}%; the late slide usually means honest repairs
               started reading as forgeries.`:`Your accuracy held at ${l}%.`}
      </p>
      <button class="next" onclick="location.reload()">Open another sale</button>
    </div>
    <div class="foot">
      Concept #16 from <code>GAME-CONCEPTS.md</code>, on the verified model in
      <code>concepts-sim/provenance.py</code>. The simulation proved a learnable signal exists;
      it could not say whether a written dossier communicates it, nor whether deciding
      <em>how much to look</em> is a good decision. Those need a person — which is what this is for.
    </div>
  </div>`;
}
render();
</script>
