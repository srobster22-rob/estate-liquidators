  }
  show("menu");
}

// ================================================================== RENDER
const ui = document.getElementById("ui");
const g2 = ui.getContext("2d");
let VPM = null;

function render(){
  if(ctxLost) return;                          // every GL call would silently no-op
  const w = cv.width = ui.width = innerWidth;
  const h = cv.height = ui.height = innerHeight;
  gl.viewport(0,0,w,h);
  gl.clearColor(.44,.52,.63,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawnBoxes = 0;

  // ---- camera: chase, with a little lag and a lot of shake
  const px = P?P.x:0, pz = P?P.z:0, py = P?P.y:groundY(0,0);
  const dist = 17, hgt = 8.5 + camPitch*7;
  const sk = shake*.6*shakeMul();
  // The chase camera sits 17 units behind with no bound, which near the arena
  // edge puts it out among the boundary spires (radius 74-79, height 7-15) at an
  // eye height of ~12.8 - inside them, and the frame renders as fog. Clamping the
  // eye sideways fixes the blindness but slides the camera onto the player and
  // loses the third-person view. Instead SHORTEN the boom until it fits, and lift
  // it as it shortens so the player stays framed.
  const CAM_BOUND = ARENA - 3;
  let ox = -Math.sin(camYaw)*dist*Math.cos(camPitch*.55);
  let oz = -Math.cos(camYaw)*dist*Math.cos(camPitch*.55);
  let k = 1;
  if(Math.abs(px+ox) > CAM_BOUND) k = Math.min(k, (Math.sign(ox)*CAM_BOUND - px)/ox);
  if(Math.abs(pz+oz) > CAM_BOUND) k = Math.min(k, (Math.sign(oz)*CAM_BOUND - pz)/oz);
  k = clamp(k, .34, 1);
  const hgt2 = hgt * (1 + (1-k)*0.85);
  const eye = [ px + ox*k + rnd(-sk,sk),
                py + hgt2 + rnd(-sk,sk),
                pz + oz*k + rnd(-sk,sk) ];
  const at  = [ px + Math.sin(camYaw)*3, py+1.4, pz + Math.cos(camYaw)*3 ];
  const proj = M4.persp(1.05, w/h, .2, 260);
  const view = M4.look(eye, at, [0,1,0]);
  gl.uniformMatrix4fv(U.uProj,false,proj);
  gl.uniformMatrix4fv(U.uView,false,view);
  gl.uniform3fv(U.uSun,  nrm([.42,.80,.30]));
  gl.uniform3fv(U.uSky,  [.74,.82,.96]);
  gl.uniform3fv(U.uGnd,  [.34,.29,.25]);
  gl.uniform3fv(U.uFog,  [.44,.52,.63]);
  gl.uniform3fv(U.uEye,  eye);
  gl.uniform1f(U.uNear, 52); gl.uniform1f(U.uFar, 145);
  gl.uniform1f(U.uFlash, flash*.30*flashMul());

  // terrain (static buffer, its own draw)
  gl.bindBuffer(gl.ARRAY_BUFFER, terBuf); bindAttribs();
  gl.drawArrays(gl.TRIANGLES, 0, terCount);

  // ---- everything dynamic, batched
  for(const p of PROPS){
    const d = Math.hypot(p.x-px, p.z-pz);
    if(d > 110) continue;
    const y = groundY(p.x,p.z);
    if(p.t===1){ box(p.x, y+p.h*.5, p.z, .22,p.h*.5,.22, [.36,.25,.16], 0, p.r);
                 box(p.x, y+p.h, p.z, p.s,p.s*.8,p.s, [.27,.50,.27], 0, p.r); }
    else if(p.t===4) box(p.x, y+p.h*.5, p.z, p.s,p.h*.5,p.s, p.c, 0, p.r);
    else box(p.x, y+p.h*.5, p.z, p.s*.5,p.h*.5,p.s*.32, p.c, 0, p.r);
  }

  // ground decals first so bodies read on top of them
  // Hazard zones are drawn as a terrain-following ring, not a flat slab - a
  // single big quad half-buried in a hillside reads as a rendering fault.
  for(const z of zones){
    const a = clamp(z.life/z.max,0,1), seg = 12;
    for(let i=0;i<seg;i++){
      const th = i/seg*TAU + z.life*.7;
      const x = z.x+Math.sin(th)*z.r, zz = z.z+Math.cos(th)*z.r;
      box(x, groundY(x,zz)+.16, zz, .21,.10,.21, z.c, .75*a);
    }
    box(z.x, groundY(z.x,z.z)+.14, z.z, .26,.08,.26, z.c, .75*a);
  }
  // Boss telegraphs. The outer ring says WHERE, the ring closing inward says
  // WHEN - so the read is "that circle, that soon" without reading a number.
  for(const h of hazards){
    const seg = Math.max(16, Math.round(h.r*4.2));
    if(h.tel > 0){
      const p = 1 - h.tel/h.telMax;
      for(let i=0;i<seg;i++){
        const th = i/seg*TAU;
        const x = h.x+Math.sin(th)*h.r, z = h.z+Math.cos(th)*h.r;
        box(x, groundY(x,z)+.26, z, .30,.26,.30, [.95,.14,.08], .70);
      }
      const ir = h.r*p;                        // the closing window
      for(let i=0;i<seg;i++){
        const th = i/seg*TAU + p*1.5;
        const x = h.x+Math.sin(th)*ir, z = h.z+Math.cos(th)*ir;
        box(x, groundY(x,z)+.22, z, .26,.22,.26, [1,.70,.12], .98);
      }
    } else {
      const a = clamp(h.live/h.liveMax, 0, 1);
      for(let i=0;i<seg;i++){
        const th = i/seg*TAU;
        const x = h.x+Math.sin(th)*h.r, z = h.z+Math.cos(th)*h.r;
        box(x, groundY(x,z)+.30, z, .34,.30,.34, [1,.46,.10], .98*a);
      }
      for(let i=0;i<seg;i++){                  // inner fill so live reads as solid
        const th = i/seg*TAU + T*1.4;
        const x = h.x+Math.sin(th)*h.r*.55, z = h.z+Math.cos(th)*h.r*.55;
        box(x, groundY(x,z)+.16, z, .26,.12,.26, [1,.28,.08], .85*a);
      }
    }
  }
  for(const r of rings){
    const seg = 26, a = clamp(r.life/r.mx,0,1);
    for(let i=0;i<seg;i++){
      const th = i/seg*TAU, x = r.x+Math.sin(th)*r.r, z = r.z+Math.cos(th)*r.r;
      box(x, groundY(x,z)+.2, z, .30,.30,.30,
          r.hot?[1,.55,.18]:[.55,.85,1], .8*a);
    }
  }
  for(const s of swings){
    const a = s.life/s.max, seg = s.evo?22:11;
    for(let i=0;i<seg;i++){
      const th = s.ang + (i/(seg-1)-.5)*s.arc;
      const rr = s.rng*(0.45+0.55*(1-a));
      const x = s.x+Math.sin(th)*rr, z = s.z+Math.cos(th)*rr;
      box(x, groundY(x,z)+.7, z, .30,.30,.30, s.evo?[1,.62,.22]:[.95,.92,.7], .9*a);
    }
  }

  // enemies
  for(const e of enemies){
    const wind = (e.ab && e.ab.phase === "tell")
      ? 1 + .22*(1 - e.ab.t/ABILITIES[e.ab.kind].tell) : 1;
    const D = e.def, S = e.sz*wind, W = D.w*S, H = D.h*S;
    const hop = Math.abs(Math.sin(e.bob))*(e.boss?.10:.20);
    const sq = e.flash>0 ? 1.25 : 1;
    // elites keep their species colour but run hot, so you can still tell a
    // CHONK from a SKITTER while knowing which one is the problem
    const base = e.elite ? [lerp(D.c[0],1,ELITE_TINT), lerp(D.c[1],.42,ELITE_TINT),
                            lerp(D.c[2],.10,ELITE_TINT)]
                         : D.c;
    const glow = e.flash>0 ? .45 : e.elite ? .32 : 0;
    const c = e.flash>0 ? [lerp(base[0],1,.72), lerp(base[1],1,.72), lerp(base[2],1,.72)]
                        : base;
    const face = Math.atan2(P.x-e.x, P.z-e.z);
    const bh = H*.62;
    box(e.x, e.y+bh*.5+hop, e.z, W*.5*sq, bh*.5, W*.5*sq, c, glow, face);
    // head + googly eyes. This is 3 boxes and it is most of the personality.
    const hy = e.y + bh + H*.19 + hop;
    box(e.x, hy, e.z, W*.40, H*.19, W*.40, c, glow, face);
    const ex = W*.17, ez = W*.40;
    for(const sgn of [-1,1]){
      const ox = Math.cos(face)*ex*sgn + Math.sin(face)*ez;
      const oz = -Math.sin(face)*ex*sgn + Math.cos(face)*ez;
      box(e.x+ox, hy+H*.04, e.z+oz, W*.10,W*.10,.04, [1,1,1], .9, face);
    }
    // and a crown. A tint alone vanishes in a crowd of 300 - this needs to be
    // a silhouette you can pick out at a glance and decide to deal with.
    if(e.elite){
      const cy = hy + H*.28, spin = T*1.7 + e.bob;
      for(let i=0;i<4;i++){
        const a = spin + i*(TAU/4);
        box(e.x + Math.sin(a)*W*.36, cy + Math.sin(T*3+i)*.05, e.z + Math.cos(a)*W*.36,
            W*.10, H*.11, W*.10, [1,.74,.16], .95, a);
      }
    }
    if(e.boss){
      const f = e.hp/e.maxhp;
      for(let i=0;i<14;i++)
        box(e.x-1.9+i*.29, e.y+D.h+1.5, e.z, .12,.12,.12,
            i/14 < f ? [1,.25,.2] : [.16,.16,.18], i/14<f?.9:0);
    }
  }

  // player: body, head, hat, and a shadow-ish base so you never lose yourself
  if(P){
    const c = P.iframe>0 && (Math.floor(T*22)%2) ? [1,1,1] : [.16,.52,1.0];
    // Eleven mutually-distinguishable colours (5 enemies + 5 elite tints + you)
    // under four vision types is not achievable - the best player colour tested
    // still sat at dE 7.5 from something. So the player is marked by SHAPE
    // instead: a bright ring nothing else in the game draws, which no colour
    // deficiency can take away. Colour stops having to carry this.
    for(let i=0;i<16;i++){
      const a = i/16*TAU + T*0.5;
      const rx = P.x+Math.sin(a)*1.15, rz = P.z+Math.cos(a)*1.15;
      box(rx, groundY(rx,rz)+.10, rz, .13,.08,.13, [1,1,1], .95);
    }
    box(P.x, P.y+.05, P.z, .80,.03,.80, [.08,.10,.09], 0);
    box(P.x, P.y+.62, P.z, .34,.62,.34, c, P.iframe>0?.55:.18, P.face);
    box(P.x, P.y+1.42, P.z, .27,.24,.27, [.92,.80,.66], 0, P.face);
    box(P.x, P.y+1.70, P.z, .34,.09,.34, [.85,.28,.24], 0, P.face);
    for(const sgn of [-1,1]){
      const ox = Math.cos(P.face)*.11*sgn + Math.sin(P.face)*.26;
      const oz = -Math.sin(P.face)*.11*sgn + Math.cos(P.face)*.26;
      box(P.x+ox, P.y+1.46, P.z+oz, .06,.06,.03, [.08,.08,.1], .5, P.face);
    }
    // stink aura
    const aw = P.kit.aura;
    if(aw){
      const s = wStat(aw), seg = 30;
      for(let i=0;i<seg;i++){
        const th = i/seg*TAU + T*.6;
        const x = P.x+Math.sin(th)*s.rad, z = P.z+Math.cos(th)*s.rad;
        box(x, groundY(x,z)+.3+Math.sin(T*3+i)*.12, z, .17,.17,.17,
            aw.evo?[.55,.95,.35]:[.62,.82,.45], .55);
      }
    }
    // orbiting skulls
    const sw = P.kit.skulls;
    if(sw){
      const s = wStat(sw);
      const n = s.n + (P.kit.dupe ? P.kit.dupe.l+1 : 0);
      for(let i=0;i<n;i++){
        const ring = sw.evo && i>=n/2;
        const a = (sw.phase||0)*(ring?-1:1) + i*(TAU/(sw.evo?n/2:n));
        const rad = s.rad*(ring?.58:1);
        const x = P.x+Math.sin(a)*rad, z = P.z+Math.cos(a)*rad;
        const y = P.y+1.1+Math.sin(T*4+i)*.18;
        box(x,y,z, .28,.28,.28, [.94,.93,.86], .35, a);
        box(x,y+.06,z+.001, .30,.09,.30, [.1,.1,.12], .1, a);
      }
    }
  }

  for(const b of bolts) box(b.x,b.y,b.z, .16,.16,.55, b.evo?[1,.6,.25]:[.7,.95,1], .95, b.a);
  for(const s of spits)
    box(s.x,s.y,s.z, s.big?.38:.22, s.big?.38:.22, s.big?.38:.22,
        s.big?[1,.42,.14]:[.9,.85,.3], .9, s.a);
  for(const m of mortars){
    const t = m.t/m.dur;
    const x = lerp(m.x0,m.tx,t), z = lerp(m.z0,m.tz,t);
    const y = lerp(m.y0, groundY(m.tx,m.tz), t) + Math.sin(t*Math.PI)*11;
    box(x,y,z,.30,.30,.30,[.95,.45,.15],.8, t*9);
    // target reticle so the shell reads as telegraphed rather than random
    const seg=14;
    for(let i=0;i<seg;i++){ const th=i/seg*TAU;
      const rx=m.tx+Math.sin(th)*m.rad, rz=m.tz+Math.cos(th)*m.rad;
      box(rx, groundY(rx,rz)+.1, rz, .14,.03,.14, [1,.4,.2], .5*t); }
  }
  for(const a of arcs){
    const al = a.life/.16;
    for(let i=0;i<a.pts.length-1;i++){
      const p0=a.pts[i], p1=a.pts[i+1], n=7;
      for(let k=0;k<n;k++){
        const t=k/n;
        box(lerp(p0[0],p1[0],t)+rnd(-.22,.22), lerp(p0[1],p1[1],t)+rnd(-.22,.22),
            lerp(p0[2],p1[2],t)+rnd(-.22,.22), .13,.13,.13,
            a.evo?[.7,.9,1]:[.85,.95,1], al);
      }
    }
  }
  for(const p of pops) box(p.x,p.y,p.z, p.s,p.s,p.s, p.c, .3);
  for(const g of gems){
    if(Math.abs(g.x-px) > 78 || Math.abs(g.z-pz) > 78) continue;
    const v = g.v>=20 ? [1,.72,.2] : g.v>=5 ? [.6,.45,1] : [.35,.9,.7];
    const s = g.v>=20 ? .27 : .19;
    box(g.x,g.y,g.z, s,s*1.45,s, v, .9, T*3+g.bob);
  }

  flush();

  // ---- 2D overlay: damage numbers, alerts, vignette
  g2.clearRect(0,0,w,h);
  VPM = { proj, view, w, h };
  g2.textAlign="center"; g2.font="700 15px ui-monospace,Menlo,monospace";
  for(const n of nums){
    const s = project(n.x,n.y,n.z);
    if(!s) continue;
    const a = clamp(n.life/.72,0,1);
    g2.globalAlpha = a;
    g2.font = n.crit ? "800 21px ui-monospace,Menlo,monospace"
                     : "700 14px ui-monospace,Menlo,monospace";
    g2.fillStyle = "#000"; g2.fillText(n.v, s[0]+1.5, s[1]+1.5);
    g2.fillStyle = n.crit ? "#ffd24a" : "#fff3dd";
    g2.fillText(n.v, s[0], s[1]);
  }
  g2.globalAlpha = 1;
  let ay = h*0.19;
  for(const al of alerts.slice(-2)){
    g2.globalAlpha = clamp(al.life/2.6,0,1);
    g2.font = "800 30px ui-monospace,Menlo,monospace";
    g2.lineWidth = 6; g2.strokeStyle = "#000"; g2.strokeText(al.text, w/2, ay);
    g2.fillStyle = al.col; g2.fillText(al.text, w/2, ay);
    ay += 38;
  }
  // virtual stick: an invisible control is not a control
  if(TOUCH && stick && running && !over){
    const dx = stick.x-stick.ox, dy = stick.y-stick.oy;
    const len = Math.hypot(dx,dy) || 1;
    const k = Math.min(1, len/STICK_MAX);
    g2.globalAlpha = .30; g2.lineWidth = 3; g2.strokeStyle = "#f2ece0";
    g2.beginPath(); g2.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI*2); g2.stroke();
    g2.globalAlpha = .55; g2.fillStyle = "#f0b429";
    g2.beginPath();
    g2.arc(stick.ox + dx/len*STICK_MAX*k, stick.oy + dy/len*STICK_MAX*k, 19, 0, Math.PI*2);
    g2.fill();
  }
  g2.globalAlpha = 1;
  if(P && P.hp/P.maxhp < .35 && running){
    const p = 1 - P.hp/P.maxhp;
    const gr = g2.createRadialGradient(w/2,h/2,Math.min(w,h)*.30, w/2,h/2,Math.max(w,h)*.62);
    gr.addColorStop(0,"rgba(0,0,0,0)");
    gr.addColorStop(1,`rgba(150,10,10,${.22+p*.42+Math.sin(T*7)*.05})`);
    g2.fillStyle=gr; g2.fillRect(0,0,w,h);
  }
}
function project(x,y,z){
  const v = xf(VPM.view, x,y,z);
  const c = [ VPM.proj[0]*v[0], VPM.proj[5]*v[1],
              VPM.proj[10]*v[2]+VPM.proj[14]*v[3], -v[2] ];
  if(c[3] <= .1) return null;
  return [ (c[0]/c[3]*.5+.5)*VPM.w, (-c[1]/c[3]*.5+.5)*VPM.h ];
}

// ===================================================================== HUD
const $ = id => document.getElementById(id);
function hud(){
  const on = running && !over;
  $("hud").style.display = on ? "block" : "none";
  if(!on || !P) return;
  $("clock").textContent = sudden ? "SUDDEN DEATH" : fmt(Math.max(0, RUN_LEN - T));
  const ph = PHASES.reduce((a,p)=> T>=p.t ? p : a, PHASES[0]);
  const nb = BOSSES[bossIdx];
  const fb = sudden ? enemies.find(e => e.final && !e.dead) : null;
  $("phase").textContent = fb
    ? `THE FINAL BONK  ${Math.max(0,Math.ceil(fb.hp)).toLocaleString()} HP  -  KILL IT`
    : nb ? `${nb.nm} IN ${fmt(Math.max(0,nb.t-T))}` : "FINAL STAND";
  $("xpbar").style.width = (P.xp/P.need*100).toFixed(1)+"%";
  $("lvl").innerHTML = `LV <b>${P.lvl}</b>`;
  const hp = clamp(P.hp/P.maxhp,0,1);
  $("hpbar").style.width = (hp*100).toFixed(1)+"%";
  $("hptxt").textContent = `${Math.max(0,Math.ceil(P.hp))} / ${Math.round(P.maxhp)}`;
  $("stats").innerHTML =
    `<b>${kills.toLocaleString()}</b> kills<br>`+
    `<span style="color:#f0b429">\u{1FA99} ${Math.floor(coinsRun + kills/9 + T/6)}</span><br>`+
    `<span style="color:#5c6470">${enemies.length} on screen</span>`;

  let html = "";
  for(const k in P.kit){
    const w = P.kit[k], W = WEAPONS[k], Pa = PASSIVES[k];
    const D = W||Pa, ic = (W&&w.evo) ? W.evo.ic : D.ic;
    const maxL = W ? 5 : Pa.max;
    const cls = w.evo ? "ev" : (w.l+1>=maxL ? "mx" : "");
    html += `<div class="slot ${Pa?"p":""} ${cls}" title="${
      (W&&w.evo)?W.evo.name:D.name}">${ic}<i>${w.evo?"★":w.l+1}</i></div>`;
  }
  $("kit").innerHTML = html;

  const wr = $("warn");
  if(nb && nb.t-T < 5 && nb.t-T > 0){
    wr.style.opacity = (Math.sin(T*10)*.5+.5).toFixed(2);
    wr.textContent = "INCOMING";
  } else wr.style.opacity = 0;
}

// ==================================================================== LOOP
let last = performance.now();
function frame(now){
  dt = Math.min(.042, (now-last)/1000); last = now;
  if(running && !over && !paused && !picking) step(dt);
  render(); hud();
  requestAnimationFrame(frame);
}
openMenu();
requestAnimationFrame(frame);

// ------------------------------------------------------------------ QA hook
// Same pattern as proto3d: a scripted handle so runs can be driven headlessly.
window.__g = {
  state: ()=>({ t:+T?.toFixed(1), lvl:P?.lvl, hp:+P?.hp.toFixed(1), maxhp:P?.maxhp,
                x:+P?.x.toFixed(1), z:+P?.z.toFixed(1),
                kills, enemies:enemies?.length, gems:gems?.length, boxes:drawnBoxes,
                dps:+(P?.dmg).toFixed(2), spd:+(P?.spd).toFixed(2), cd:+(P?.cd).toFixed(3),
                over, won:runWon, why:runWhy, sudden, picking, coins:save.coins }),
  kit:   ()=>Object.keys(P.kit).map(k=>`${k}:${P.kit[k].evo?"EVO":P.kit[k].l+1}`),
  start: (id)=>startRun(id||"intern"),
  // scripted driving ignores the pause that losing pointer lock would cause
  step:  (n=60, d=1/60)=>{ if(paused) togglePause(false);
                           for(let i=0;i<n && !over;i++){ if(picking) autoPick(); step(d); }
                           return window.__g.state(); },
  resume:()=>{ paused=false; document.getElementById("paused").classList.remove("on"); },
  // Run a whole run to its end inside the page. Driving this tick-by-tick from
  // outside costs more than the simulation does.
  runOut:(maxT=RUN_LEN+400, d=1/60)=>{
    if(paused) togglePause(false);
    let guard=0;
    while(!over && T<maxT && guard++<200000){ if(picking) autoPick(); step(d); }
    return window.__g.state();
  },
  give:  (k,n=1)=>{ if(!P.kit[k]) P.kit[k]={key:k,l:0,t:0,evo:false};
                    // step rank by rank: HEART and friends accumulate, so a
                    // single applyPassive after a multi-rank jump under-applies
                    for(let i=0;i<n && P.kit[k].l<4;i++){ P.kit[k].l++; applyPassive(k); }
                    return window.__g.kit(); },
  evolve:(k)=>{ if(P.kit[k]){ P.kit[k].evo=true; P.kit[k].l=5; } return window.__g.kit(); },
  xp:    v=>gainXP(v),
  // radius lets a test drop enemies inside a melee weapon's reach; omit it and
  // they use the normal off-screen ring
  spawn: (t,n=1,radius)=>{ for(let i=0;i<n;i++){
      if(radius===undefined) spawnEnemy(t);
      else { const a=Math.random()*TAU, r=Math.random()*radius;
             spawnEnemy(t, clamp(P.x+Math.cos(a)*r,-ARENA+2,ARENA-2),
                           clamp(P.z+Math.sin(a)*r,-ARENA+2,ARENA-2)); }
    } return enemies.length; },
  boss:  i=>spawnBoss(BOSSES[i||0]),
  // position/HP/body of the boss on the field, so a test can hold an exact
  // gap to it instead of chasing a target that walks toward the player.
  bossAt:()=>{ const b=enemies.find(e=>e.boss && !e.dead);
               return b ? {x:b.x, z:b.z, hp:b.hp, rad:b.rad} : null; },
  god:   ()=>{ P.maxhp=1e9; P.hp=1e9; },
  // split frame cost into simulation vs rendering. Software GL exaggerates the
  // render half enormously, so only the sim number transfers to real hardware.
  perf:  (n=90)=>{
    let sim=0, ren=0;
    for(let i=0;i<n;i++){
      let t0=performance.now(); step(1/60);      sim += performance.now()-t0;
      t0=performance.now();     render();        ren += performance.now()-t0;
    }
    return { simMs:+(sim/n).toFixed(2), renderMs:+(ren/n).toFixed(2),
             enemies:enemies.length, boxes:drawnBoxes,
             simFpsCeiling:Math.round(1000/(sim/n)) };
  },
  drainPicks: (suppress)=>{ pendingLevels=0; picking=false; hide("pick");
                            if(suppress!==undefined) noLevels=!!suppress; },
  killBoss: ()=>{ const b=enemies.find(e=>e.final&&!e.dead); if(b) killEnemy(b);
                  return window.__g.state(); },
  bot:   (on=true)=>botDrive=on,
  hasTouch: ()=>HAS_TOUCH,
  hasMouse: ()=>HAS_MOUSE,
  hadLock:  ()=>hadLock,
  dragging: ()=>dragging,
  isAirborne: ()=>!!P&&P.air,
  isPaused: ()=>paused,
  camYaw: ()=>camYaw,
  place: (x,z)=>{ P.x=clamp(x,-ARENA+1.5,ARENA-1.5);
                  P.z=clamp(z,-ARENA+1.5,ARENA-1.5); P.y=groundY(P.x,P.z); },
  hpx:   ()=>hpScale(T),
  // Report the HP MULTIPLIER (maxhp / species base), not raw HP. Raw medians
  // compare a population whose elite half is mostly skitters (8 base HP) with a
  // normal half that is mostly spitters (34) - that measures species mix, not
  // eliteness, and it read "elite 283 vs normal 331" while elites were in fact
  // 3.2x tougher. Third time an instrument in this project has been confidently
  // wrong; normalise the thing you are not asking about.
  dmg:   ()=>{ const d=dmgDealt, b=dmgBoss; dmgDealt=0; dmgBoss=0;
               return { all:d, boss:b }; },
  haz:   ()=>({ n:hazards.length, tel:hazards.filter(h=>h.tel>0).length,
                live:hazards.filter(h=>h.tel<=0).length }),
  casts: ()=>Object.assign({}, bossCasts),
  freezeSpawns: (v=true)=>{ noSpawn=v; },
  // drop n identical hazard zones on one spot, so a test can prove the
  // overlap cap without having to reproduce a whole SCORCHED EARTH trail
  zones: (x,z,n,dps,r=2.2)=>{ for(let i=0;i<n;i++)
    zones.push({ x, z, r, dps, life:9, max:9, c:[1,.42,.12], tick:0, evo:true }); },
  burnStack: ()=>BURN_STACK,
  // WEBGL_lose_context is the only way to reproduce what a phone does when it
  // reclaims the GPU, so the restore path gets exercised instead of assumed.
  loseCtx:    ()=>LOSE_EXT?.loseContext(),
  restoreCtx: ()=>LOSE_EXT?.restoreContext(),
  ctxLost:    ()=>ctxLost,
  // render() sets drawnBoxes from 0 every frame, so parking it at -1 makes a
  // stale value impossible to mistake for a live one
  clearBoxes: ()=>{ drawnBoxes = -1; },
  opts:    ()=>({ sound:save.sound, motion:save.motion }),
  setOpt,
  gain:    ()=> master ? master.gain.value : null,
  // force the camera-shake term so a test can hold it still and compare frames
  setShake:(v)=>{ shake = v; },
  // colours the player has to tell apart at a glance, for the contrast check
  // Everything the contrast check needs, derived from the real constants rather
  // than retyped: enemy colours, their elite tints, the full terrain shade range,
  // and the per-channel lighting an enemy side face actually receives.
  palette: ()=>{
    const el = c => [lerp(c[0],1,ELITE_TINT), lerp(c[1],.42,ELITE_TINT),
                     lerp(c[2],.10,ELITE_TINT)];
    const enemies = {}, ground = [];
    for(const k in ENEMIES){ enemies[k] = ENEMIES[k].c; enemies[k+"*"] = el(ENEMIES[k].c); }
    for(const base of [TERRAIN_A, TERRAIN_B])
      for(const h of [TERRAIN_HRANGE[0], 0.5, TERRAIN_HRANGE[1]])
        ground.push([base[0]+h*TERRAIN_H[0], base[1]+h*TERRAIN_H[1], base[2]+h*TERRAIN_H[2]]);
    // shader: lit = c*(hemi*0.78 + d*0.92) + c*backlight*0.14
    const sun = nrm([.42,.80,.30]);
    const hemi = ny => [0,1,2].map(i => lerp([.34,.29,.25][i], [.74,.82,.96][i], ny*.5+.5));
    const hl = Math.hypot(sun[0], sun[2]);
    const dv = (sun[0]/hl)*sun[0] + (sun[2]/hl)*sun[2];   // best-lit vertical face
    const mul = (ny,d,back) => hemi(ny).map(v => v*0.78 + d*0.92 + back*0.14);
    return { enemies, ground,
             lightSunlit: mul(0, dv, 0),      // enemy side face, toward the sun
             lightShaded: mul(0, 0, dv),      // enemy side face, away
             lightGround: mul(1, sun[1], 0) };
  },
  // sample the level-up roller without taking anything - offers() is pure
  peekOffers: (n=60)=>{ const seen={};
    for(let i=0;i<n;i++) for(const o of offers()) seen[o.nm] = (seen[o.nm]||0)+1;
    return seen; },
  // isolate one character stat at a time - reasoning about which of two
  // plausible causes is the real one has a poor track record here
  patchChar: (id, mods)=>{ const c = CHARS.find(x=>x.id===id);
                           if(c) c.mods = Object.assign({}, c.mods, mods);
                           return c && c.mods; },
  hp:    ()=>P.hp,
  elites:()=>{ const med = a => { const v=a.slice().sort((x,y)=>x-y);
                                  return v.length ? v[v.length>>1] : 0; };
    const E = enemies.filter(e=>e.elite), N = enemies.filter(e=>!e.elite&&!e.boss);
    return { n:E.length, total:enemies.length,
             chance:+Math.max(0,eliteChance(T)).toFixed(3),
             mult:     +med(E.map(e=>e.maxhp/e.def.hp)).toFixed(2),
             normMult: +med(N.map(e=>e.maxhp/e.def.hp)).toFixed(2) }; },
  dbg:   ()=>{ const ds=enemies.map(e=>Math.hypot(e.x-P.x,e.z-P.z)).sort((a,b)=>a-b);
               const hs=enemies.map(e=>e.hp).sort((a,b)=>a-b);
               return { nearest: ds[0]??-1, inRange: ds.filter(d=>d<8).length,
                        mean: ds.length ? ds.reduce((a,b)=>a+b,0)/ds.length : -1,
                        medHP: hs[hs.length>>1]??0, dmg: P.dmg*100 }; },
  comp:  ()=>enemies.reduce((a,e)=>{ a[e.type]=(a[e.type]||0)+1; return a; }, {}),
  skipTo:s=>{ T=s; },
  wipeSave: ()=>{ localStorage.removeItem(SAVEKEY);
                  save={coins:0,up:{},best:0,wins:0,unlocked:{}}; openMenu(); },
  // set permanent upgrades directly - localStorage is only read at page load,
  // so a test cannot simulate a veteran save by writing to it mid-session
  setUpgrades: (up)=>{ save.up = Object.assign({}, up); writeSave(); return save.up; },
};
// Scored so the autopilot commits to a build instead of collecting one rank of
// everything - otherwise no run ever reaches an evolution and the whole second
// half of the progression goes unmeasured.
function autoPick(){
  const cards = [...document.getElementById("pkCards").children];
  if(!cards.length) return;
  const nW = Object.keys(P.kit).filter(k=>WEAPONS[k]).length;
  const nP = Object.keys(P.kit).filter(k=>PASSIVES[k]).length;
  // Spreading upgrades evenly across six weapons reaches rank 3 on everything
  // and rank 5 on nothing, so no run ever evolves. Commit: push whichever
  // weapon is already furthest along, and prioritise ITS partner passive.
  let lead = null, leadL = -1;
  for(const k in P.kit) if(WEAPONS[k] && P.kit[k].l > leadL){ leadL = P.kit[k].l; lead = k; }
  const wanted = lead ? WEAPONS[lead].evo.need : null;
  const score = c => {
    const t = c.dataset.otype, k = c.dataset.okey;
    if(t === "evo")  return 1000;
    if(t === "up")   return WEAPONS[k] ? 100 + P.kit[k].l*30
                                       : 78 + (k === wanted ? 70 : 0) + P.kit[k].l*8;
    if(t === "new")  return WEAPONS[k] ? (nW < 4 ? 70 : 12)
                                       : (k === wanted ? 120 : nP < 4 ? 55 : 8);
    return 1;
  };
  cards.sort((a,b)=>score(b)-score(a))[0].click();
}
