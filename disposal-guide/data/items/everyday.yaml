- slug: shredded-paper
  category: everyday
  names:
    en: [shredded paper, paper shreds, confetti paper]
    es: [papel triturado]
  universal:
    hazard: none
    neverCurbside: false
    why:
      en: Shredding makes paper fibers too short for some mills and too small for some sorting
        equipment, so programs handle it very differently.
    prep: []
    sourceRefs: []

- slug: glass-containers
  category: everyday
  names:
    en: [glass, glass bottle, glass jar, wine bottle, broken glass, drinking glass, window glass,
      mirror, pyrex, ceramic dish]
    es: [vidrio, botella de vidrio, frasco, vidrio roto, espejo, ceramica]
  universal:
    hazard: caution
    neverCurbside: false
    why:
      en: Container glass, window glass, drinking glasses, Pyrex, and ceramics all melt at
        different temperatures. Even where bottles and jars are accepted, the others usually are
        not.
    prep:
      - en: Wrap broken glass so it cannot cut whoever handles the bag.
    sourceRefs: []

- slug: styrofoam
  category: everyday
  names:
    en: [styrofoam, foam, packing peanuts, foam cooler, takeout container, egg carton foam,
      polystyrene, expanded polystyrene]
    es: [unicel, poliestireno, espuma, hielera de unicel]

- slug: textiles
  category: everyday
  names:
    en: [clothes, clothing, textiles, shoes, worn out clothes, ripped clothes, towels, bedding,
      fabric scraps]
    es: [ropa, textiles, zapatos, ropa vieja, sabanas]
  universal:
    hazard: none
    neverCurbside: false
    why:
      en: Worn-out clothing still has value as fiber, even when nobody would wear it. Textile
        collection is its own system. It is not the same as donation, and not the same as
        curbside recycling.
    prep:
      - en: Wearable items go to donation. Stained and torn items are not trash automatically —
          ask whether there is a textile recovery bin nearby.
    sourceRefs: []

- slug: cooking-oil
  category: everyday
  names:
    en: [cooking oil, used cooking oil, fryer oil, grease, bacon grease, fat]
    es: [aceite de cocina, aceite de cocina usado, grasa, manteca]
  universal:
    hazard: caution
    neverCurbside: false
    why:
      en: Cooking oil poured down a drain congeals in the sewer and blocks it. This causes real
        backups into houses.
    prep:
      - en: Never pour it down any drain, including with hot water.
      - en: Let it cool and solidify in a container. Some places collect it for biodiesel,
          especially after holidays.
    sourceRefs: []

