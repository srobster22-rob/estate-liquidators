# Medications, sharps, electronics, and the two appliance categories people ask about.

- slug: medications
  category: medical
  names:
    en: [medication, medicine, pills, prescription, expired pills, old prescriptions, unused
      medicine, drugs, painkillers, opioids, antibiotics]
    es: [medicamento, medicina, pastillas, receta, medicina vencida]
  universal:
    hazard: hazardous
    neverCurbside: true
    why:
      en: Medicine in the trash can be found by a child, a pet, or someone looking for it. Medicine
        flushed down a toilet can end up in water.
    prep:
      - en: A drug take-back location is the preferred option. Many pharmacies, hospital
          pharmacies, and police departments have a drop box, and some offer prepaid mail-back
          envelopes.
        es: Lo mejor es un punto de recolección de medicamentos. Muchas farmacias y estaciones de
          policía tienen un buzón.
      - en: You can search the DEA's year-round drop-off locator by ZIP code to find one near you.
      - en: A small number of medicines are on the FDA "flush list" because one dose can kill
          someone who takes it by accident. Only flush a medicine if it is on that list — check
          the list, do not assume.
      - en: If it is not on the flush list and you cannot get to a take-back site, put it in the
          trash this way. Take it out of the container. Mix it with something
          unappealing like dirt, cat litter, or used coffee grounds. Seal it in a bag.
          Do not crush tablets.
        es: Si no puede llegar a un punto de recolección, mezcle el medicamento con algo
          desagradable como tierra o arena para gatos, séllelo en una bolsa y tírelo a la basura.
    nationalOptions:
      - en: 'DEA year-round drop-off locator: https://apps.deadiversion.usdoj.gov/pubdispsearch/'
      - en: 'FDA flush list: check before flushing anything.'
    sourceRefs: [fda-drug-disposal, fda-flush-list, fda-nonflush-trash, dea-collection-sites]

- slug: sharps
  category: medical
  names:
    en: [needles, sharps, syringe, insulin needle, lancet, epipen, auto injector, pen needle,
      diabetic needles]
    es: [agujas, jeringa, jeringas, lanceta, agujas de insulina]
  universal:
    hazard: hazardous
    neverCurbside: true
    why:
      en: A loose needle in a bag or a bin can stick a sanitation worker, a housekeeper, a family
        member, or a child.
    prep:
      - en: Never put loose needles in household or public trash or recycling, and never flush
          them down the toilet.
        es: Nunca ponga agujas sueltas en la basura ni en el reciclaje, y nunca las tire por el
          inodoro.
      - en: Put used sharps immediately into an FDA-cleared sharps container. Pharmacies, medical
          supply companies, and providers sell them.
      - en: Stop filling the container when it is about three-quarters full. Overfilling causes
          needle sticks. Then follow your community's rule for getting rid of it.
    nationalOptions:
      - en: 'Safe Needle Disposal will tell you what your area does: 1-800-643-1643.'
    sourceRefs: [fda-sharps-dos-donts, fda-sharps-best-way]

- slug: electronics
  category: electronics
  names:
    # "monitor" deliberately lives on tv-crt, not here: CRT and flat-panel monitors have
    # different answers and different fees, so the disambiguating item should win the word.
    en: [electronics, e-waste, ewaste, computer, laptop, desktop, printer, keyboard,
      tablet, cell phone, smartphone, old phone, game console, stereo, dvd player, cable box,
      router, microwave, small appliance, broken microwave]
    es: [electronicos, basura electronica, computadora, laptop, impresora, telefono,
      celular, microondas]
  universal:
    hazard: caution
    neverCurbside: true
    why:
      en: Electronics contain materials worth recovering and some that should not go to landfill.
        Many also contain a lithium battery, which is the part that starts fires.
    prep:
      - en: Wipe your data first. Sign out of accounts, then factory reset.
      - en: If it still works, donating it is better than recycling it.
      - en: Look for a recycler certified to the R2 or e-Stewards standard.
      - en: If a battery can be removed easily, remove it and handle it as a battery.
    sourceRefs: [epa-electronics, epa-certified-recyclers]

- slug: tv-crt
  category: electronics
  names:
    en: [tv, television, crt tv, tube tv, old television, flat screen, computer monitor, crt
      monitor]
    es: [television, tele, televisor, monitor]
  universal:
    hazard: caution
    neverCurbside: true
    why:
      en: Old tube (CRT) televisions and monitors contain several pounds of leaded glass. Flat
        screens are different but still are not curbside items.
    prep:
      - en: Do not break the screen.
      - en: Some places charge a fee to take a CRT and some do not accept them at all. Call
          before you load it into the car.
    sourceRefs: [epa-electronics]

- slug: smoke-detector
  category: electronics
  names:
    en: [smoke detector, smoke alarm, fire alarm, carbon monoxide detector, co detector]
    es: [detector de humo, alarma de humo, detector de monoxido]
  universal:
    hazard: caution
    neverCurbside: true
    why:
      en: Most household smoke alarms are the ionization type and contain a very small sealed
        radioactive source (americium-241). The amount is small, but where these are allowed to
        go varies by state and county more than almost anything else on this list.
    prep:
      - en: Take the battery out and handle it as a battery.
      - en: Many manufacturers will take an alarm back by mail. Check the brand's website for a
          return program before assuming anything else.
      - en: Rules differ. Some places accept them in household trash, others require hazardous
          waste. Ask your county rather than following advice written for somewhere else.
    sourceRefs: [nrc-smoke-detectors, epa-americium-smoke]

- slug: appliance-refrigerant
  category: bulky
  names:
    en: [refrigerator, fridge, freezer, air conditioner, ac unit, window unit, dehumidifier, heat
      pump, mini fridge]
    es: [refrigerador, nevera, congelador, aire acondicionado, deshumidificador]
  universal:
    hazard: hazardous
    neverCurbside: true
    why:
      en: These contain refrigerant that has to be recovered by someone certified to do it before
        the appliance is scrapped. Venting it is illegal.
    prep:
      - en: Do not cut the lines or try to drain it yourself.
      - en: If it has a door that latches, remove the door before it sits outside — a child can
          be trapped inside one.
      - en: Many utilities run appliance pickup programs and some pay a rebate for an old working
          second fridge.
    sourceRefs: [epa-hhw]
