# The everyday items where the answer is almost entirely local.
#
# These deliberately carry no local rule. Whether your program takes glass, or plastic film, or
# shredded paper depends on what your material recovery facility can actually sort, and it
# genuinely differs between neighboring towns. Guessing here is how a whole load gets rejected.
#
# The universal layer still earns its keep: the *why* travels even when the verdict doesn't.

- slug: plastic-bags-film
  category: everyday
  names:
    en: [plastic bag, plastic bags, grocery bags, bread bag, bubble wrap, plastic film, shrink
      wrap, ziploc bag, produce bag, air pillows]
    es: [bolsa de plastico, bolsas plasticas, bolsa de mandado, plastico de burbujas]
  universal:
    hazard: caution
    neverCurbside: false
    why:
      en: Plastic bags wrap around the spinning parts of sorting machines. Facilities have to stop the line and cut
        them out by hand. Most curbside
        programs do not want them, even
        where the plastic itself is
        recyclable.
      es: Las bolsas de plástico se enredan en las máquinas de la planta de reciclaje.
    prep:
      - en: Many grocery stores have a collection bin for clean, dry bags and film near the
          entrance. That is a different system from your curbside cart.
      - en: Never put recyclables inside a bag in your cart unless your program specifically tells
          you to. Bagged recyclables are often pulled off the line as trash.
    sourceRefs: []

- slug: pizza-box
  category: everyday
